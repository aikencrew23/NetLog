<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Net Control Log</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Net Control">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#15233F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F7; --surface:#FFFFFF; --sunk:#E4EAF2; --ink:#15233F; --muted:#56657D;
  --rule:#CDD6E3; --rule-soft:#E3E9F1; --signal:#C8102E; --signal-ink:#FFFFFF;
  --accent:#1F4E9C; --accent-ink:#FFFFFF; --ok:#1C7A4A; --tok:#FFE7A3; --tok-ink:#3D2B00;
  --shadow:0 1px 0 rgba(21,35,63,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1422; --surface:#142035; --sunk:#0F1A2C; --ink:#E8EEF8; --muted:#97A5BD;
    --rule:#283752; --rule-soft:#1D2A42; --signal:#FF4D5E; --signal-ink:#1A0005;
    --accent:#86ADF2; --accent-ink:#0C1422; --ok:#52C78E; --tok:#4A3A10; --tok-ink:#FFE7A3;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1422; --surface:#142035; --sunk:#0F1A2C; --ink:#E8EEF8; --muted:#97A5BD;
  --rule:#283752; --rule-soft:#1D2A42; --signal:#FF4D5E; --signal-ink:#1A0005;
  --accent:#86ADF2; --accent-ink:#0C1422; --ok:#52C78E; --tok:#4A3A10; --tok-ink:#FFE7A3;
  --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.call,.num,h1,h2,.display{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 120px}
img{max-width:100%}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--rule)}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:56px}
.bar h1{font-size:24px;font-weight:700;margin:0;line-height:1;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.end-btn{color:var(--signal);border-color:var(--signal);padding:8px 12px;flex:0 0 auto}
.livecount{flex:0 0 auto;text-align:center;padding:0 4px}
.livebar{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding-left:8px}
.lb-left{display:flex;align-items:center;gap:2px;min-width:0}
.lb-title{min-width:0}
.lb-title h1{font-size:22px}
.airstrip{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:0 16px 8px;white-space:nowrap}
.airstrip .clock{font-size:17px}
.homeclock{text-align:right;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap}
.homeclock .hc-local{font-size:19px}
.homeclock .hc-utc{font-size:15px;color:var(--muted)}
.standby{font-size:13px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.standby::before{content:"";width:9px;height:9px;border-radius:50%;border:2px solid var(--muted)}
.btn.begin-btn{background:var(--ok);border-color:var(--ok);color:var(--surface);padding:8px 12px;flex:0 0 auto}
.banner.ready{border-color:var(--rule)}
.lb-right{display:flex;justify-content:flex-end}

/* vertical step timeline */
.livegrid{display:grid;grid-template-columns:108px minmax(0,1fr);gap:12px;align-items:start;margin-top:10px}
.livegrid.right{grid-template-columns:minmax(0,1fr) 108px}
.livegrid.right .rail{order:2}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,120px) + 8px);max-height:calc(100vh - var(--hdr,120px) - 110px);overflow-y:auto;scrollbar-width:none;padding:4px 0}
.rail::-webkit-scrollbar{display:none}
.rail ol{list-style:none;margin:0;padding:0}
.rail li{position:relative}
.rail button{position:relative;display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:start;width:100%;min-height:40px;padding:6px 2px 6px 0;background:none;border:0;cursor:pointer;text-align:left;font-size:14px;line-height:1.25;color:var(--muted)}
.rail .dot{width:12px;height:12px;margin:2px 0 0 5px;border-radius:50%;border:2px solid var(--rule);background:var(--surface);z-index:1}
.rail li.done .dot{background:var(--muted);border-color:var(--muted)}
.rail li.cur .dot{width:16px;height:16px;margin:0 0 0 3px;background:var(--signal);border-color:var(--signal);box-shadow:0 0 0 4px color-mix(in srgb,var(--signal) 22%,transparent)}
.rail li.cur .t{color:var(--ink);font-weight:700}
.rail .t{overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.livegrid .prompter .kind span:last-child{display:none}
.rail.right li::before{left:auto;right:10px}
.rail.right button{grid-template-columns:1fr 22px;text-align:right;padding:6px 0 6px 2px}
.rail.right .t{grid-column:1;grid-row:1}
.rail.right .dot{grid-column:2;grid-row:1;margin:2px 5px 0 0}
.rail.right li.cur .dot{margin:0 3px 0 0}
/* horizontal step timeline (top / bottom) */
.htl{overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 12px}
.htl::-webkit-scrollbar{display:none}
.htl ol{list-style:none;margin:0;padding:0;display:flex;gap:2px}
.htl li{flex:0 0 auto}
.htl button{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:64px;max-width:104px;min-height:44px;padding:4px 6px;background:none;border:0;cursor:pointer;font-size:13px;line-height:1.2;color:var(--muted);text-align:center}
.htl.bottom button{flex-direction:column-reverse}
.htl .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--rule);background:var(--surface);flex:0 0 auto}
.htl li.done .dot{background:var(--muted);border-color:var(--muted)}
.htl li.cur .dot{width:16px;height:16px;background:var(--signal);border-color:var(--signal);box-shadow:0 0 0 4px color-mix(in srgb,var(--signal) 22%,transparent)}
.htl li.cur .t{color:var(--ink);font-weight:700}
.htl.top{margin-bottom:10px}
.htl.bottom{margin:0 auto;max-width:760px;padding:8px 12px 0}
.wrap{padding-bottom:calc(var(--ftr,80px) + 40px)}
.livegrid .prompter{margin-top:0}
.livegrid .prompter .say{font-size:19px}
.livegrid .grid2{grid-template-columns:1fr}
@media (min-width:600px){.livegrid{grid-template-columns:150px minmax(0,1fr)}.livegrid.right{grid-template-columns:minmax(0,1fr) 150px}.livegrid .grid2{grid-template-columns:1fr 1fr}.livegrid .prompter .say{font-size:21px}}
.livecount .count{font-size:30px}
.livecount .lbl{font-size:12px;color:var(--muted);line-height:1.1}
@media (max-width:400px){.clock .utc{display:none}.lb-title .nn{display:none}.oa-txt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}
.bar .sub{font-size:13px;color:var(--muted)}
.grow{flex:1;min-width:0}
.icon-btn{border:0;background:transparent;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn:active{background:var(--sunk)}
.icon-btn svg{width:22px;height:22px}

/* live status */
.onair{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--signal)}
.onair::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 0 var(--signal);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--signal) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.onair::before{animation:none}}
.clock{font-family:"Barlow Condensed",sans-serif;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.onair{white-space:nowrap}
.count{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;line-height:1}

/* sections */
h2{font-size:22px;font-weight:600;margin:28px 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
p{margin:.4em 0}

/* buttons */
.btn{appearance:none;border:1px solid var(--rule);background:var(--surface);border-radius:10px;min-height:44px;padding:9px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.live{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.danger{color:var(--signal)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* net cards */
.net{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:14px;display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;margin-bottom:12px;box-shadow:var(--shadow)}
.net .logo{width:56px;height:56px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;overflow:hidden;font-family:"Barlow Condensed";font-weight:700;font-size:18px;color:var(--muted)}
.net .logo img{width:100%;height:100%;object-fit:contain}
.net h3{margin:0;font-size:19px}
.net .meta{font-size:14px;color:var(--muted)}
.net .acts{grid-column:1/-1;display:flex;gap:10px}
.net .acts .btn.primary{flex:1}

.banner{margin-top:16px;background:var(--surface);border:2px solid var(--signal);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner>.grow{flex:1 1 100%}
.banner>.row{width:100%}
.banner>.row .btn{flex:1}

/* lists */
.list{background:var(--surface);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--rule-soft);cursor:pointer;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.li:first-child{border-top:0}
.li:active{background:var(--sunk)}
.empty{padding:18px 14px;color:var(--muted)}

/* forms */
label.f{display:block;margin:10px 0}
label.f>span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=email],input[type=time],input[type=date],select,textarea{width:100%;border:1px solid var(--rule);border-radius:10px;background:var(--surface);padding:10px 12px;min-height:44px}
textarea{min-height:90px;resize:vertical;line-height:1.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
@media (max-width:480px){.grid3{grid-template-columns:1fr 1fr}}
fieldset{border:1px solid var(--rule);border-radius:14px;padding:6px 14px 14px;margin:16px 0;background:var(--surface)}
legend{font-family:"Barlow Condensed";font-weight:600;font-size:19px;padding:0 6px}

/* step chips */
.steps{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;max-width:760px;margin:0 auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap;min-height:36px}
.chip.done{color:var(--muted)}
.chip.cur{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}

/* teleprompter */
.prompter{background:var(--surface);border:1px solid var(--rule);border-left:6px solid var(--signal);border-radius:14px;padding:16px 16px 14px;margin-top:6px;box-shadow:var(--shadow)}
.prompter .kind{font-family:"Barlow Condensed";font-weight:600;font-size:15px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.prompter .say{font-size:21px;line-height:1.5;margin:10px 0}
.cue{display:inline-block;font-style:italic;font-size:15px;color:var(--muted);border:1px dashed var(--rule);border-radius:8px;padding:4px 10px;margin:2px 0}
mark.tok{background:var(--tok);color:var(--tok-ink);border-radius:4px;padding:0 3px}
.prompter.compact .say{font-size:17px}

/* check-in entry */
.entry{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;margin-top:14px}
.entry .callin{font-family:"Barlow Condensed";font-weight:700;font-size:28px;letter-spacing:1px;text-transform:uppercase;min-height:52px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;min-height:42px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:15px}
.seg button.on{background:var(--ink);color:var(--bg)}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;min-height:0}
.sugg button{border:1px solid var(--rule);background:var(--sunk);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:15px;min-height:38px}
.hint{font-size:14px;color:var(--muted);margin-top:4px;min-height:1.2em}
.hint.warn{color:var(--signal);font-weight:700}

/* ledger */
.ledger{background:var(--surface);border:1px solid var(--rule);border-radius:14px;overflow:hidden;margin-top:14px}
.lrow{display:grid;grid-template-columns:34px 1fr auto;gap:2px 10px;padding:10px 12px;border-top:1px solid var(--rule-soft);align-items:center;cursor:pointer;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.lrow:first-of-type{border-top:0}
.lrow{cursor:default}
.lctl{display:flex;align-items:center;gap:6px}
.pill.tog,.ackbtn,.editbtn{min-height:36px;min-width:46px;padding:4px 10px;border-radius:8px;font:700 14px "Atkinson Hyperlegible",system-ui,sans-serif;cursor:pointer}
.pill.tog{border:1.5px solid currentColor}
.ackbtn{background:var(--sunk);color:var(--muted);border:1.5px solid var(--rule)}
.ackbtn.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.editbtn{background:var(--surface);color:var(--accent);border:1.5px solid var(--rule)}
.pill.tog:active,.ackbtn:active,.editbtn:active{transform:scale(.96)}
.lrow .n{font-family:"Barlow Condensed";font-weight:600;color:var(--muted);font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
.lrow .who .call{font-size:21px;font-weight:700;letter-spacing:.5px}
.lrow .who .nm{color:var(--muted);font-size:15px}
.lrow .tr{grid-column:2/-1;font-size:15px}
.pill{font-size:13px;font-weight:700;border-radius:999px;padding:3px 9px;border:1px solid currentColor}
.pill.in{color:var(--ok)}
.pill.out{color:var(--muted)}
.pill.nco{color:var(--accent)}
.lhead{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--sunk);font-size:14px;color:var(--muted)}

/* comments queue */
.now{background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:14px;margin-top:14px}
.now .call{font-size:34px;font-weight:700;line-height:1;letter-spacing:1px}
.now .nm{color:var(--muted)}
.q{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.q button{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:6px 10px;min-height:40px;cursor:pointer;font-family:"Barlow Condensed";font-weight:600;font-size:17px}
.q button.done{color:var(--muted);text-decoration:line-through;background:var(--sunk)}
.q button.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.listening{color:var(--signal)}

/* footer nav */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.foot-in{max-width:760px;margin:0 auto;display:flex;gap:10px;padding:10px 16px}
.foot-in .btn{flex:1}
.foot-in .btn.narrow{flex:0 0 auto}

.tabs{display:flex;max-width:760px;margin:0 auto;padding:0 16px 10px;gap:6px}
.tabs button{flex:1;border:1px solid var(--rule);background:var(--surface);border-radius:10px;min-height:40px;cursor:pointer;font-weight:700}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:10px;text-align:center}
.stat .num{font-size:30px;font-weight:700;line-height:1}
.stat .lbl{font-size:13px;color:var(--muted)}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}}

/* step editor */
.sed{border:1px solid var(--rule);border-radius:12px;padding:10px 12px;margin:10px 0;background:var(--bg)}
.sed .row{justify-content:space-between}
.sed .tag{font-family:"Barlow Condensed";font-weight:600;font-size:16px}

/* dialog */
dialog{border:0;border-radius:18px 18px 0 0;padding:0;width:100%;max-width:760px;margin:auto auto 0;background:var(--surface);color:var(--ink);max-height:88vh}
dialog::backdrop{background:rgba(5,10,20,.5)}
dialog .sh{padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto;max-height:88vh}
dialog h3{font-family:"Barlow Condensed";font-size:24px;margin:0 0 6px}
@media (min-width:700px){dialog{border-radius:18px;margin:auto}}


.miss{background:var(--surface);border:1px dashed var(--rule);border-radius:12px;padding:10px 12px;margin-top:14px}
.mcall{display:inline-block;margin:4px 4px 0 0;padding:1px 7px;border-radius:6px;border:1px solid var(--rule)}
.newtag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:5px;background:var(--tok);color:var(--tok-ink);font:700 12px "Atkinson Hyperlegible",sans-serif;vertical-align:3px;letter-spacing:.3px}
.welcome{margin-top:8px;padding:6px 10px;border-radius:8px;background:var(--tok);color:var(--tok-ink);font-weight:700;font-size:15px}
.ask{margin-top:10px;padding:8px 10px;border-left:4px solid var(--accent);background:var(--sunk);border-radius:6px;font-size:17px}
.hint.new{color:var(--ok);font-weight:700}
.chk{gap:6px;padding:4px 10px 4px 0}
.applogo{width:28px;height:28px;border-radius:7px;vertical-align:-5px;margin-right:7px}
.btn.qrz{min-height:36px;padding:4px 12px;font-size:14px;color:var(--accent)}
.btn.qrz.tiny{min-height:30px;padding:2px 10px;margin-left:8px}
.hint{display:flex;align-items:center;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(var(--ftr,80px) + 12px);transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;z-index:50;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="sheet"><div class="sh" id="sheetBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script>
"use strict";

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const newId = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, "0");
const utcHM = d => pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes());
const localHM = d => d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const dateStr = d => `${d.getMonth() + 1}/${d.getDate()}/${d.getFullYear()}`;
const fileDate = d => `${pad(d.getMonth() + 1)}-${pad(d.getDate())}-${String(d.getFullYear()).slice(2)}`;
const durStr = ms => { const m = Math.max(0, Math.round(ms / 60000)); return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`; };
const elapsed = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 60)}:${pad(s % 60)}`; };
const time12 = hm => { if (!hm) return ""; const [h, m] = hm.split(":").map(Number); const d = new Date(); d.setHours(h, m || 0, 0, 0); return localHM(d); };
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600); }

/* ---------- script parsing (used for templates and .docx import) ---------- */
function tokenize(t) {
  return t.replace(/\(\s*Name\s+and\s+Call\s*Sign\s*\)/gi, "{NCO_NAME}, {NCO_CALL}")
          .replace(/\(\s*Location\s*\)/gi, "{NCO_QTH}")
          .replace(/\(\s*Total\s+Stations\s*\)/gi, "{TOTAL}");
}
function roundTitle(t, late) {
  if (/emergency|priority/i.test(t)) return "Emergency & priority traffic";
  if (/announcement|business/i.test(t)) return "Announcements";
  if (/mobile|echolink/i.test(t)) return "Mobile & EchoLink";
  const m = t.match(/\b([A-Z])\s*-\s*([A-Z])\b/);
  if (m) return `Stations ${m[1]}–${m[2]}`;
  if (/general/i.test(t)) return "General check-ins";
  if (/additional|late/i.test(t)) return "Additional check-ins";
  return "Check-ins";
}
function readTitle(t, isLast) {
  if (isLast) return "Close net";
  if (/begins in one minute|stand by/i.test(t)) return "Opening";
  if (/net control station|my name is/i.test(t)) return "Preamble";
  if (/frequency/i.test(t)) return "Frequency";
  if (/closing the formal/i.test(t)) return "Close formal";
  if (/informal portion/i.test(t)) return "Informal portion";
  if (/traffic appropriate/i.test(t)) return "Net purpose";
  return "Script";
}
function parseScript(paras) {
  const isCue = t => /^[-–—].*[-–—]$/.test(t) && t.length > 2;
  const steps = []; let before = null; let afterComments = false; let first = true;
  for (const raw of paras) {
    const t = String(raw).replace(/\s+/g, " ").trim();
    if (!t) continue;
    if (first) { first = false; if (/script/i.test(t) && !isCue(t)) continue; }
    if (isCue(t)) {
      const cue = t.replace(/^[-–—\s]+|[-–—\s]+$/g, "");
      if (/comment/i.test(cue)) { steps.push({ id: newId(), type: "comments", title: "Comments", text: "", before: "", after: cue }); afterComments = true; continue; }
      const last = steps[steps.length - 1];
      if (/^at\b/i.test(cue) || !last || last.after || last.type === "comments") before = cue;
      else last.after = cue;
      continue;
    }
    const s = { id: newId(), type: "read", title: "", text: tokenize(t), before: before || "", after: "" };
    before = null;
    const calls = /please call|or net control/i.test(t) && !/closing/i.test(t);
    if (calls) { s.type = "checkin"; s.late = afterComments; s.title = roundTitle(t, afterComments); }
    steps.push(s);
  }
  const reads = steps.filter(s => s.type === "read");
  steps.forEach(s => { if (s.type === "read") s.title = readTitle(s.text, s === reads[reads.length - 1]); });
  const lastRead = reads[reads.length - 1]; if (lastRead) lastRead.type = "close";
  return steps;
}
function netFromTemplate(key) {
  const t = TEMPLATES[key]; const n = clone(t); delete n.paras;
  n.id = newId(); n.steps = parseScript(t.paras); return n;
}
function blankNet() {
  return { id: newId(), name: "", short: "", clubCall: "", day: "", time: "", freq: "", offset: "", toneIn: "", toneOut: "", echolink: "", backup: "", manager: "", managerEmail: "", logo: "",
    steps: [
      { id: newId(), type: "read", title: "Preamble", text: "This is {NCO_CALL}, Net Control. My name is {NCO_NAME} and I am located in {NCO_QTH}.", before: "", after: "Break" },
      { id: newId(), type: "checkin", title: "Check-ins", text: "Do we have any check-ins for the net? Please call Net Control.", before: "", after: "Break and hold for responses, acknowledge stations" },
      { id: newId(), type: "comments", title: "Comments", text: "", before: "", after: "Call on stations for comment in order of check-in." },
      { id: newId(), type: "checkin", late: true, title: "Additional check-ins", text: "Do we have any additional check-ins? Please call Net Control.", before: "", after: "" },
      { id: newId(), type: "close", title: "Close net", text: "This is {NCO_CALL} closing the net. We had {TOTAL} stations check in. 73 all and clear.", before: "", after: "" }
    ] };
}

/* ---------- state + storage ---------- */
const S = { me: { call: "", name: "", fullName: "", qth: "" }, nets: {}, logs: {}, dir: {}, gone: {} };
const UI = { view: "home", logId: null, tab: "script", draft: null, form: freshForm(), cur: null, sample: null, downloads: null, busy: {}, dirQ: "" };
function freshForm() { return { call: "", name: "", qth: "", stay: "in", traffic: "", auto: false }; }

const Store = {
  mode: "local", col: null, timers: {},
  key(kind, id) { return kind === "me" || kind === "dir" ? kind : kind + "_" + id; },
  loadLocal() { try { const raw = localStorage.getItem("ncl:v1"); if (raw) { const o = JSON.parse(raw); Object.assign(S, o); } } catch (e) {} },
  saveLocal() { try { localStorage.setItem("ncl:v1", JSON.stringify(S)); } catch (e) {} },
  async connect() {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    this.col = db.collection("data/users/" + uid);
    let snap;
    try { snap = await this.col.get(); } catch (e) { console.warn("db read failed", e); return; }
    const fresh = { me: S.me, nets: {}, logs: {}, dir: {} }; const push = [];
    let gotMe = false, gotDir = false;
    const gone = S.gone || {};
    snap.docs.forEach(d => { const v = d.data(); if (!v) return;
      if (gone[d.id]) { this.col.doc(d.id).delete().catch(() => {}); return; }
      if (d.id === "me") { fresh.me = Object.assign({ call: "", name: "", fullName: "", qth: "" }, v.me || {}); gotMe = true; }
      else if (d.id === "dir") { fresh.dir = Object.assign({}, v.stations || {}); gotDir = true; }
      else if (v.kind === "net" && v.data) fresh.nets[v.id] = clone(v.data);
      else if (v.kind === "log" && v.data) fresh.logs[v.id] = clone(v.data);
    });
    for (const k in S.nets) if (!fresh.nets[k]) { fresh.nets[k] = S.nets[k]; push.push(["net", k]); }
    for (const k in S.logs) if (!fresh.logs[k] || (S.logs[k].updated || 0) > (fresh.logs[k].updated || 0)) { fresh.logs[k] = S.logs[k]; push.push(["log", k]); }
    fresh.gone = gone;
    let dirChanged = false;
    for (const k in S.dir) if (!fresh.dir[k]) { fresh.dir[k] = S.dir[k]; dirChanged = true; }
    if (!gotMe || (!fresh.me.call && S.me.call)) { if (S.me.call) { fresh.me = S.me; push.push(["me"]); } }
    if (dirChanged || (!gotDir && Object.keys(fresh.dir).length)) push.push(["dir"]);
    Object.assign(S, fresh); this.mode = "db"; this.saveLocal();
    push.forEach(([k, id]) => this.save(k, id));
    render();
  },
  save(kind, id) {
    if (kind === "log" && S.logs[id]) { S.logs[id].updated = Date.now(); pushLive(S.logs[id]); }
    this.saveLocal();
    if (this.mode !== "db") return;
    const k = this.key(kind, id); clearTimeout(this.timers[k]);
    this.timers[k] = setTimeout(() => this.write(kind, id, false), 700);
  },
  flush(kind, id) {
    if (kind === "log" && S.logs[id]) { S.logs[id].updated = Date.now(); pushLive(S.logs[id]); }
    this.saveLocal(); if (this.mode !== "db") return;
    const k = this.key(kind, id); clearTimeout(this.timers[k]); return this.write(kind, id, false);
  },
  async write(kind, id, retried) {
    let body;
    if (kind === "me") body = { kind: "me", me: S.me };
    else if (kind === "dir") body = { kind: "dir", stations: S.dir };
    else { const o = kind === "net" ? S.nets[id] : S.logs[id]; if (!o) return; body = { kind, id, data: o }; }
    try { await this.col.doc(this.key(kind, id)).set(body); }
    catch (e) {
      if (e && e.code === "unavailable" && !retried) setTimeout(() => this.write(kind, id, true), 800 + Math.random() * 1200);
      else toast("Couldn’t sync to your account. It’s saved on this device.");
    }
  },
  async remove(kind, id) {
    S.gone = S.gone || {}; S.gone[this.key(kind, id)] = Date.now();
    this.saveLocal();
    if (this.mode === "db") { try { await this.col.doc(this.key(kind, id)).delete(); } catch (e) {} }
  }
};

    checkins: [{ id: newId(), call: S.me.call, name: S.me.name, qth: S.me.qth, stay: "in", ack: true, traffic: "", nco: true, stepId: null, at: now.toISOString(), done: true }] };

function addCheckin() {
  const L = curLog(); const st = L.net.steps[L.step]; const f = UI.form;
  const call = f.call.trim().toUpperCase().replace(/\s+/g, "");
  if (!call) { toast("Enter a call sign first."); $("#f-call")?.focus(); return; }
  const dup = L.checkins.find(c => c.call === call);
  if (dup) { toast(`${call} is already checked in as #${L.checkins.indexOf(dup) + 1}.`); return; }
  const c = { id: newId(), call, name: f.name.trim(), qth: f.qth.trim(), stay: f.stay, ack: f.stay !== "in", first: !S.dir[call], traffic: f.traffic.trim(), stepId: st.id, round: st.title, at: new Date().toISOString(), done: false };
  L.checkins.push(c);
  const prev = S.dir[call] || {};
  const nk = (L.net.short || "").toLowerCase();
  S.dir[call] = Object.assign({}, prev, { name: c.name || prev.name || "", qth: c.qth || prev.qth || "", count: (prev.count || 0) + 1, last: c.at.slice(0, 10) });
  if (nk) S.dir[call][nk] = (prev[nk] || 0) + 1;
  Store.save("log", L.id); Store.save("dir");
  UI.form = freshForm();
  render();

let rec = null;
function toggleListen(id) {
  const L = curLog(); const c = L.checkins.find(x => x.id === id); if (!c || !SR) return;
  if (rec) { rec.stop(); return; }
  try { rec = new SR(); } catch (e) { toast("Listening isn’t available here. Use the keyboard’s mic to dictate."); return; }
  rec.continuous = true; rec.interimResults = true; rec.lang = "en-US";
  const base = c.traffic ? c.traffic.trim() + " " : "";
  rec.onresult = ev => {
    let fin = "", interim = "";
    for (let i = 0; i < ev.results.length; i++) { const r = ev.results[i]; if (r.isFinal) fin += r[0].transcript + " "; else interim += r[0].transcript; }
    c.traffic = (base + fin).trim();
    const ta = document.querySelector(`[data-bind="ck:${c.id}:traffic"]`); if (ta) ta.value = (base + fin + interim).trim();
    Store.save("log", L.id);
  };
  rec.onerror = e => { toast(e.error === "not-allowed" || e.error === "service-not-allowed" ? "Microphone is blocked here. Use the keyboard’s mic to dictate instead." : "Listening stopped."); };
  rec.onend = () => { rec = null; UI.recFor = null; render(); };
  try { rec.start(); UI.recFor = id; render(); } catch (e) { rec = null; toast("Couldn’t start listening."); }
}

const TIDY_RULES = `You tidy a ham radio net control operator's rough notes into the TRAFFIC column of a net log.
Write in the operator's own style: a short comma-separated list of phrases, not sentences. Examples of their entries:
- "Soggy, 5\\" rain, POTA power QSO, power outage, net control"
- "4am job, tractor time, Meshtastic repeater on Hibriten"
- "Antenna repair, back on the nets!"
Keep every fact, number, place and call sign (call signs uppercase). Fix obvious speech-to-text mistakes in ham terms (POTA, SOTA, QSO, EchoLink, repeater, simplex, ARES, 73). Never add facts that are not in the notes. Under 25 words.`;
async function tidyOne(id) {
  const L = curLog(); const c = L.checkins.find(x => x.id === id); if (!c || !UI.sample) return;
  if (!c.traffic.trim()) { toast("Add some notes first."); return; }
  UI.busy[id] = true; render();
  try {
    const r = await UI.sample(`${TIDY_RULES}\nReply with the entry text only.\n\nStation: ${c.call} ${c.name} (${c.qth})\nNotes:\n${c.traffic}`, { modelTier: "quick" });
    const out = (r.text || "").trim().replace(/^["“]|["”]$/g, "");
    if (out) { c.prev = c.traffic; c.traffic = out; Store.save("log", L.id); }
  } catch (e) { toast(e.code === "rate_limited" ? "Too many requests. Try again in a moment." : e.code === "not_granted" ? "Tidy needs permission to ask Claude." : "Couldn’t tidy the notes."); }
  UI.busy[id] = false; render();
}
async function tidyAll() {
  const L = curLog(); const items = L.checkins.map((c, i) => ({ n: i + 1, call: c.call, notes: c.traffic })).filter(x => x.notes && x.notes.trim());
  if (!items.length) { toast("No traffic notes to tidy."); return; }
  UI.busy.all = true; render();
  try {
    const out = await UI.sample.json(`${TIDY_RULES}\nTidy each station's notes. Return JSON only: an array of {"n": number, "traffic": string}, one per input item, same n values.\n\n${JSON.stringify(items)}`, { modelTier: "default" });
    if (Array.isArray(out)) { out.forEach(o => { const c = L.checkins[o.n - 1]; if (c && typeof o.traffic === "string" && o.traffic.trim()) { c.prev = c.traffic; c.traffic = o.traffic.trim(); } }); Store.save("log", L.id); toast("Traffic tidied. Tap a row to adjust."); }

/* ---------- schedule logic (shared by the app and the club server) ---------- */
const pad2 = n => String(n).padStart(2, "0");
const DOW_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
function todayIn(tz, now) { return new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit" }).format(now || new Date()); }
function addDays(ymd, n) { const [y, m, d] = ymd.split("-").map(Number); const t = new Date(Date.UTC(y, m - 1, d) + n * 864e5); return `${t.getUTCFullYear()}-${pad2(t.getUTCMonth() + 1)}-${pad2(t.getUTCDate())}`; }
function occurrences(net, from, days) {
  const out = [];
  for (let i = 0; i < days; i++) { const s = addDays(from, i); const [y, m, d] = s.split("-").map(Number); if (new Date(Date.UTC(y, m - 1, d)).getUTCDay() === Number(net.dow)) out.push(s); }
  return out;
}
function scheduledFor(net, date) {
  const [y, m, d] = date.split("-").map(Number);
  if (net.mode === "weekly") { const w = Math.ceil(d / 7); return (w >= 5 ? net.fifth : (net.weeks || {})[w]) || ""; }
  const rot = (net.rotation || []).filter(Boolean); if (!rot.length) return "";
  const [ay, am] = (net.anchor || `${y}-${pad2(m)}`).split("-").map(Number);
  const k = ((y * 12 + m) - (ay * 12 + am)) % rot.length;
  return rot[(k + rot.length) % rot.length];
}
function whoFor(cfg, key, date) {

  if (ov) return { id: ov, override: true };
  return { id: scheduledFor(cfg.nets[key], date), override: false };
}
function zonedToUtc(date, time, tz) {
  const [y, m, d] = date.split("-").map(Number); const [hh, mm] = (time || "00:00").split(":").map(Number);
  const want = Date.UTC(y, m - 1, d, hh, mm); let g = want;
  const f = new Intl.DateTimeFormat("en-US", { timeZone: tz, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
  for (let i = 0; i < 2; i++) { const p = Object.fromEntries(f.formatToParts(new Date(g)).map(x => [x.type, x.value])); g += want - Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute); }
  return g;
}
function personLabel(cfg, id) { const p = (cfg.people || {})[id]; return p ? [p.name, p.call && `(${p.call})`].filter(Boolean).join(" ") : ""; }
function time12s(t) { if (!t) return ""; const [h, m] = t.split(":").map(Number); return `${((h + 11) % 12) + 1}:${pad2(m)} ${h < 12 ? "AM" : "PM"}`; }
function dateLabel(date, opts) { const [y, m, d] = date.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d, 12)).toLocaleDateString("en-US", Object.assign({ weekday: "short", month: "short", day: "numeric", timeZone: "UTC" }, opts || {})); }
function defaultConfig(now) {
  const t = todayIn("America/New_York", now).slice(0, 7);
  return { tz: "America/New_York", people: {}, overrides: {},
    nets: {
      larc: { name: "LARC Club Net", dow: 2, time: "19:00", mode: "weekly", weeks: { 1: "", 2: "", 3: "", 4: "" }, fifth: "", manager: "", controllers: [], reminders: true },
      cares: { name: "CARES Net", dow: 0, time: "21:00", mode: "monthly", rotation: [""], anchor: t, manager: "", controllers: [], reminders: true }
    } };
}
function recipients(cfg, key, extraId) {
  const net = cfg.nets[key]; const ids = new Set([net.manager, ...(net.controllers || []), extraId].filter(Boolean));
  return [...ids].map(id => (cfg.people || {})[id]).filter(p => p && /@/.test(p.email || "")).map(p => p.email.trim());
}

/* ---------- new stations, regulars ---------- */
function netKey(n) { return (n.short || n.name || "net").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
function missingRegs(L) {
  const nk = (L.net.short || "").toLowerCase(); if (!nk) return [];
  const here = new Set(L.checkins.map(c => c.call));
  const arr = Object.entries(S.dir).map(([c, d]) => [c, d, d[nk] || 0]).filter(x => x[2] > 0); if (!arr.length) return [];
  const thr = Math.max(3, Math.round(Math.max(...arr.map(x => x[2])) * 0.3));
  return arr.filter(x => x[2] >= thr && !here.has(x[0])).sort((a, b) => b[2] - a[2]);
}
function missingHtml(L) {

/* ---------- monthly report ---------- */
function repData() {
  if (!UI.repMonth) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); UI.repMonth = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; }
  const [y, m] = UI.repMonth.split("-").map(Number);
  const logs = Object.values(S.logs).filter(l => { if (l.status === "live") return false; const d = new Date(l.startedAt); return d.getFullYear() === y && d.getMonth() + 1 === m; }).sort((a, b) => a.startedAt.localeCompare(b.startedAt));
  const groups = {};
  logs.forEach(l => { const k = l.net.short || l.net.name; (groups[k] = groups[k] || { name: l.net.name, logs: [] }).logs.push(l); });
  const sum = ls => {
    const calls = new Set(); let ci = 0, tr = 0, inN = 0, first = 0, mins = 0, ph = 0;
    ls.forEach(l => { const len = l.endedAt ? (new Date(l.endedAt) - new Date(l.startedAt)) / 60000 : 0; mins += len; ph += l.checkins.length * len / 60;
      l.checkins.forEach(c => { calls.add(c.call); ci++; if (c.traffic) tr++; if (c.stay === "in") inN++; if (c.first) first++; }); });
    return { nets: ls.length, ci, uniq: calls.size, avg: ls.length ? ci / ls.length : 0, tr, inN, first, mins, ph };
  };
  return { y, m, label: new Date(y, m - 1, 1).toLocaleDateString([], { month: "long", year: "numeric" }), logs, groups, all: sum(logs), sum };
}

function stepsPos() { return ["top", "left", "right", "bottom"].includes(S.me.stepsPos) ? S.me.stepsPos : "left"; }
function htl(steps, L, pos) {
  return `<nav class="htl ${pos}" aria-label="Script steps"><ol>${steps.map((s, i) => `<li class="${i === L.step ? "cur" : i < L.step ? "done" : ""}"><button data-act="goto" data-i="${i}" ${i === L.step ? 'aria-current="step"' : ""}><span class="dot"></span><span class="t">${esc(s.title || "Step " + (i + 1))}</span></button></li>`).join("")}</ol></nav>`;
}
function scrollChip() { setTimeout(() => document.querySelector(".chip.cur")?.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" }), 20); }

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (f) { e.preventDefault(); f(b, e); }
});
document.addEventListener("input", e => {
  const el = e.target; const bind = el.dataset && el.dataset.bind; if (!bind) return;
  const val = el.type === "checkbox" ? el.checked : el.value;
  if (bind === "form:call") return onCallInput(el);
  if (bind.startsWith("club:") && UI.club) { const path = bind.slice(5); clubSet(path, /\.dow$/.test(path) ? Number(val) : val); if (el.tagName === "SELECT" || el.type === "checkbox") render(); return; }
  if (bind.startsWith("clubctl:") && UI.club) { const [, k, id] = bind.split(":"); const n = UI.club.nets[k]; n.controllers = (n.controllers || []).filter(x => x !== id); if (val) n.controllers.push(id); return; }
  if (bind.startsWith("clubov:") && UI.club) { const k = bind.slice(7); UI.club.overrides = UI.club.overrides || {}; if (val) UI.club.overrides[k] = val; else delete UI.club.overrides[k]; return; }
  if (bind.startsWith("form:")) { const k = bind.slice(5); UI.form[k] = val; if (k === "name" || k === "qth") UI.form.auto = false; return; }
  if (bind.startsWith("draft:")) { UI.draft[bind.slice(6)] = val; return; }
  if (bind.startsWith("step:")) { const [, i, k] = bind.split(":"); UI.draft.steps[+i][k] = val; if (k === "type") render(); return; }
  if (bind.startsWith("ck:")) { const [, id, k] = bind.split(":"); const L = curLog(); const c = L.checkins.find(x => x.id === id); if (c) { c[k] = val; Store.save("log", L.id); } return; }
  if (bind.startsWith("log:")) { const L = curLog(); const path = bind.slice(4).split("."); let o = L; while (path.length > 1) o = o[path.shift()]; o[path[0]] = val; Store.save("log", L.id); return; }
  if (bind === "dirq") { UI.dirQ = val; const pos = el.selectionStart; render(); const n = $("#dirq"); n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) {} }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "docx-in" && el.files && el.files[0]) importDocx(el.files[0]);
  if (el.dataset && el.dataset.bind && el.tagName === "SELECT" && el.dataset.bind.startsWith("step:")) render();
  if (el.dataset && el.dataset.bind && el.type === "checkbox" && el.dataset.bind.startsWith("step:")) { const [, i, k] = el.dataset.bind.split(":"); UI.draft.steps[+i][k] = el.checked; }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const id = e.target.id;
  if (id === "f-call") { e.preventDefault(); (UI.form.name ? $("#f-traffic") : $("#f-name"))?.focus(); }
  else if (id === "f-name") { e.preventDefault(); $("#f-qth")?.focus(); }
  else if (id === "f-qth" || id === "f-traffic") { e.preventDefault(); addCheckin(); }
});

function tickClock() {
  const hl = $("#hc-local"); if (hl) { const n = new Date(); hl.textContent = etHM(n); $("#hc-utc").textContent = `(${utcHM(n)} UTC)`; }
  const el = $("#clock"); const L = curLog(); if (!el || !L) return;
  const now = new Date(); el.textContent = `${etHM(now)} (${utcHM(now)} UTC)`;
  const ee = $("#elapsed"); if (ee) ee.textContent = elapsed(now - new Date(L.startedAt));
}
const ET_FMT = new Intl.DateTimeFormat("en-US", { hour: "numeric", minute: "2-digit", timeZoneName: "short" });
function etHM(d) { return ET_FMT.format(d); }
function onAir(L) { return L.onAir !== false; }
setInterval(tickClock, 1000);

/* ---------- boot ---------- */
Store.loadLocal();
migrateTitles();
purgeStandby();
const live = liveLog(); if (live) { UI.logId = live.id; UI.view = "live"; }
render();
(async () => {
  if (!window.claude || !window.claude.use) { clubPing(); return; }
  claude.use("sample").then(s => { if (s) { UI.sample = s; if (UI.view === "live" || UI.view === "review") render(); } });
  claude.use("downloads").then(d => { if (d) UI.downloads = d; });
  await Store.connect();
  migrateTitles();
  purgeStandby(UI.view === "live" ? UI.logId : null); if (UI.view === "live" && !curLog()) { UI.view = "home"; render(); }
  const lv = liveLog(); if (lv && UI.view === "home") { UI.logId = lv.id; UI.view = "live"; render(); }
})();
</script>
</body>
</html>
